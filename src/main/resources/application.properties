# Application name
quarkus.application.name=async-profiler-mcp-server

# HTTP port
quarkus.http.port=8080

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.causa.profiler".level=DEBUG

# REST Client Configuration
quarkus.rest-client.follow-redirects=true
quarkus.rest-client.profiler-controller.url=${PROFILER_CONTROLLER_URL:http://localhost:8080}
quarkus.rest-client.profiler-controller.connect-timeout=5000
quarkus.rest-client.profiler-controller.read-timeout=60000

# Package as a single executable uber-jar (same as kruize-mcp-server)
quarkus.package.jar.type=uber-jar

# MCP server info
quarkus.mcp.server.server-info.name=async-profiler-mcp-server
quarkus.mcp.server.server-info.version=1.0.0

# SSE transport endpoints (quarkus-mcp-server-sse)
#   SSE stream:          GET  /mcp/sse
#   JSON-RPC messages:   POST /mcp/sse/messages
#   Streamable HTTP:     POST /mcp  (MCP spec §6.3)

# ── Profiling Controller backend ─────────────────────────────────────────────
# The controller is a separate service that owns:
#   - sidecar injection
#   - async-profiler / jcmd invocation
#   - JFR file retrieval and parsing
#   - report generation
profiler.controller.default-namespace=${PROFILER_DEFAULT_NAMESPACE:default}
