apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-profiler-mcp-server
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: async-profiler-mcp-server
  template:
    metadata:
      labels:
        app: async-profiler-mcp-server
    spec:
      containers:
        - name: async-profiler-mcp-server
          image: quay.io/khansaad/async-profiler-mcp-server:0.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PROFILER_CONTROLLER_URL
              # jafra-controller service DNS (in-cluster, same monitoring namespace)
              value: "http://jafra-controller.monitoring:8080"
            - name: PROFILER_DEFAULT_NAMESPACE
              value: "default"
            - name: QUARKUS_HTTP_PORT
              value: "8083"
          ports:
            - containerPort: 8083
              name: http
          resources:
            requests:
              memory: "250Mi"
              cpu: "0.5"
            limits:
              memory: "250Mi"
              cpu: "0.5"
---
apiVersion: v1
kind: Service
metadata:
  name: async-profiler-mcp-server-service
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: async-profiler-mcp-server
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      nodePort: 30083
