apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-profiler-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: async-profiler-mcp-server
  template:
    metadata:
      labels:
        app: async-profiler-mcp-server
    spec:
      containers:
        - name: async-profiler-mcp-server
          image: quay.io/khansaad/async-profiler-mcp-server:0.0.1
          env:
            - name: PROFILER_CONTROLLER_URL
              # Use the stable Service DNS name of the Profiling Controller.
              # Format: http://<service-name>.<namespace>:<port>
              value: "http://profiling-controller.profiling:8081"
            - name: PROFILER_DEFAULT_NAMESPACE
              value: "default"
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "250Mi"
              cpu: "0.5"
            limits:
              memory: "250Mi"
              cpu: "0.5"
---
apiVersion: v1
kind: Service
metadata:
  name: async-profiler-mcp-server-service
spec:
  selector:
    app: async-profiler-mcp-server
  ports:
    - name: async-profiler-mcp-server-port
      port: 8080
      targetPort: 8080
